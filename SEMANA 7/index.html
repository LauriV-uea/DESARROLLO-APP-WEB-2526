<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Lista de productos</h1>

    <ul id="listaProductos"></ul>  <!-- Lista donde se redendarizan los productos -->


    <!-- Bitón para agregar nuevos productos -->
    <input id="nombreProducto" placeholder="Nombre">
    <input id="precioProducto" type="number" placeholder="Precio">
    <input id="descripcionProducto" placeholder="Descripción">

    <button id="agrProducto">Agregar Producto</button>  
    
    <script src="script.js"></script>


    
</body>
</html>
